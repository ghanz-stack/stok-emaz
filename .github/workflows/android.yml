name: Build APK - Stok Emas Gudang Ibu NID
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  apk:
    # Pin 24.04: ubuntu-latest akan migrasi ke 26 (Okt 2026) dan bisa merusak build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # Sediakan Android SDK + terima lisensi (ini penyebab umum exit code 1)
      - uses: android-actions/setup-android@v3
      - name: Install deps
        run: npm ci || npm install
      - name: Add platform android (sekali saja)
        run: if [ ! -d android ]; then npx cap add android; fi
      - name: Sync web -> android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: stok-emas-gid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # --- Signed release (opsional): isi Secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD lalu uncomment ---
